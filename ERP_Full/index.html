<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/keiros-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Keiros ERP</title>
    <script>
      (function () {
        // Keep in sync with ThemeProvider: light 06:00–18:00, dark overnight.
        var DAY_START = 6;
        var NIGHT_START = 18;
        function hourNow(timeZone) {
          try {
            var options = { hour: '2-digit', hourCycle: 'h23' };
            if (timeZone) options.timeZone = timeZone;
            var parts = new Intl.DateTimeFormat('en-US', options).formatToParts(new Date());
            for (var i = 0; i < parts.length; i++) {
              if (parts[i].type === 'hour') {
                var hour = Number(parts[i].value);
                return hour === 24 ? 0 : hour;
              }
            }
          } catch (e) {}
          return new Date().getHours();
        }
        function storedTimeZone() {
          try {
            var raw = localStorage.getItem('keiros-erp-clock-location');
            if (!raw) return '';
            var parsed = JSON.parse(raw);
            return parsed && typeof parsed.timeZone === 'string' ? parsed.timeZone : '';
          } catch (e) {
            return '';
          }
        }
        function themeForNow() {
          var hour = hourNow(storedTimeZone());
          return hour >= DAY_START && hour < NIGHT_START ? 'light' : 'dark';
        }
        function readOverride() {
          try {
            var raw = localStorage.getItem('keiros-erp-theme-override');
            if (!raw) return null;
            var parsed = JSON.parse(raw);
            if (parsed.theme !== 'light' && parsed.theme !== 'dark') return null;
            if (typeof parsed.until !== 'number' || parsed.until <= Date.now()) return null;
            if (parsed.theme === themeForNow()) return null;
            return parsed.theme;
          } catch (e) {
            return null;
          }
        }
        var theme = readOverride() || themeForNow();
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
