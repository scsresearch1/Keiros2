# Netlify — Keiros API_DEMO (Vite SPA)
# Site settings → Build & deploy → Base directory = API_DEMO

[build]
  command = "npm ci && npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions.overpass]
  timeout = 26

# Overpass via serverless function (raw upstream redirects returned 406).
[[redirects]]
  from = "/api/overpass"
  to = "/.netlify/functions/overpass"
  status = 200
  force = true

[[redirects]]
  from = "/api/overpass-kumi"
  to = "/.netlify/functions/overpass"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Never cache the SPA shell or build stamp — hashed JS/CSS can stay immutable.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/build-id.json"
  [headers.values]
    Cache-Control = "no-store, max-age=0"
    Content-Type = "application/json"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[build.environment]
  NODE_VERSION = "22"
  SECRETS_SCAN_OMIT_KEYS = "VITE_GOOGLE_MAPS_API_KEY,VITE_GOOGLE_MAPS_MAP_ID"
  VITE_GOOGLE_MAPS_API_KEY = "AIzaSyCnQijsiKFJtL39zOTCQfGUQ_Bkju5hWiY"
