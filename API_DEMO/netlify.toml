# Netlify — Keiros API_DEMO (Vite SPA)
# Create a SECOND Netlify site from the same repo.
# Site settings → Build & deploy → Base directory = API_DEMO

[build]
  command = "npm ci && npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "22"
  # Browser Maps key must end up in the JS bundle — allow secrets scan to skip it.
  # Enable Maps JavaScript API + Routes API on this key in Google Cloud.
  SECRETS_SCAN_OMIT_KEYS = "VITE_GOOGLE_MAPS_API_KEY"
  VITE_GOOGLE_MAPS_API_KEY = "AIzaSyCnQijsiKFJtL39zOTCQfGUQ_Bkju5hWiY"

# Also set in Netlify UI if preferred (same name). Required for Vite build:
#   VITE_API_BASE=https://YOUR-SERVICE.onrender.com
#   VITE_GOOGLE_MAPS_API_KEY=...
